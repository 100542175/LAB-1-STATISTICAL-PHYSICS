name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: statphys_lab1
      - name: Unit tests
        run: pytest -q
      - name: Smoke test of the full pipeline (fast mode)
        run: python main.py --quick --out /tmp/report_ci
